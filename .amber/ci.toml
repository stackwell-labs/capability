# amber-ci template: a Rust library crate or workspace (docs/onboarding.md).
#
# The shared libraries (store-core, vault, capability, warden-verify, ...)
# have no GitHub test workflow today, so this is rust-test.yml run from the
# repo root with nothing extra: tests, then lint and an advisory scan that
# report but do not block. A library's Cargo.lock is not the one its
# consumers build with, so its audit informs rather than gates.
#

# Hermetic reuse (design §2, "Writing a reusable job"): a `reuse = true` job
# runs `fetch` with the network, then `run` with none (services stay
# reachable). Everything that downloads goes in `fetch`; cargo in `run` is
# `--offline`, so a missing fetch fails as "offline", not as a DNS error.

version = 1

[job.test]
image = "docker.io/library/rust:1.97.0-bookworm@sha256:8fa55b2f3ddf97471ab6a767bfa3f37e6bad0986ba823e75fea57e2a2a5c3073"
fetch = ["cargo fetch --locked"]
run = [
  # --workspace so a virtual or multi-crate root tests every member;
  # doc tests run too (cargo test includes them).
  "cargo test --workspace --locked --offline --no-fail-fast",
]
required_for_main = true
reuse = true
timeout_minutes = 30
cache = "rust-1.97.0"
git_read = []

[job.test.env]
CARGO_HOME = "/cache/cargo"
CARGO_TARGET_DIR = "/cache/target"

[job.lint]
image = "docker.io/library/rust:1.97.0-bookworm@sha256:8fa55b2f3ddf97471ab6a767bfa3f37e6bad0986ba823e75fea57e2a2a5c3073"
fetch = ["rustup component add clippy rustfmt", "cargo fetch --locked"]
run = [
  # Both run, as in rust-test.yml (two continue-on-error steps): a fmt
  # failure must not hide clippy's findings. Fails if either fails.
  "rc=0; cargo fmt --all --check || rc=1; cargo clippy --workspace --all-targets --locked --offline -- -D warnings || rc=1; exit $rc",
]
required_for_main = false
reuse = true
timeout_minutes = 30
cache = "rust-1.97.0"
git_read = []

[job.lint.env]
CARGO_HOME = "/cache/cargo"
CARGO_TARGET_DIR = "/cache/target"

[job.audit]
image = "docker.io/library/rust:1.97.0-bookworm@sha256:8fa55b2f3ddf97471ab6a767bfa3f37e6bad0986ba823e75fea57e2a2a5c3073"
run = [
  "cd / && cargo install --locked cargo-audit --version 0.22.2",
  "cargo audit --file Cargo.lock",
]
required_for_main = false
timeout_minutes = 20
cache = "audit"

[job.audit.env]
CARGO_HOME = "/cache/cargo"
